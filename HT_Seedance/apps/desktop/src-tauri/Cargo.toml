[package]
name = "ht-dola-desktop"
version = "1.0.0"
description = "HT Dola Studio Desktop Application Shell"
authors = ["HT Studio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
tauri-plugin-opener = "2.5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[lib]
name = "ht_dola_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
